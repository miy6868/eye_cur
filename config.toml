# 서버 설정. 바꾼 뒤에는 서버를 다시 시작한다

# 기본 카메라 번호. 카메라가 여러 대면 서버를 켤 때 번호를 묻고, Enter를 누르면 이 번호를 쓴다
camera_index = 0

# 카메라에 요청할 영상 크기 [너비, 높이]. 클수록 멀리 앉아도 얼굴이 선명하지만 CPU를 조금 더 쓴다.
# 카메라가 지원하지 않는 크기면 카메라가 고른 크기로 나온다. 느린 PC면 [640, 480]
camera_size = [1920, 1080]

# 시선 모델에 쓸 CPU 스레드 수. 0이면 자동(논리 코어 수의 절반, 2~8개)
cpu_threads = 0

# true: 8비트로 줄인 UniGaze 모델(약 2배 빠름, 조금 더 흔들림). false면 원래 크기(fp32) 모델
gaze_int8 = true

# 측정한 카메라 내부 파라미터 JSON 파일 경로(camera_matrix, dist_coefficients). 비우면 추정값을 쓴다
camera_intrinsics = ""

# true: 보정할 때마다 시선 값·점 위치·오차를 logs/pursuit.jsonl에 한 줄씩 쌓는다(카메라 영상은 없음). 보정 분석용. false면 저장하지 않는다
save_calibration_log = true

# ── 아래 [mouth]·[eyes]는 서버가 쓰고, [click]부터는 서버가 확장에 보낸다 ──
# 바꾼 뒤에는 서버를 다시 켜고, 쓰던 웹페이지도 새로고침한다

[mouth]  # 입 벌림 판정. MAR = 입술 안쪽 위아래 거리 ÷ 입 너비. 두 값 사이에서는 이전 상태를 유지한다
open_mar = 0.20    # 이보다 커지면 '벌림'. 처음 0.30은 입을 너무 크게 벌려야 했다
closed_mar = 0.12  # 이보다 작아지면 '다뭄'

[eyes]  # 눈 판정. 평소 뜬 눈 대비 비율이고, 두 눈이 모두 넘어야 한다
closing = 0.20  # 이보다 작으면 '감는 중': 이 동안은 시선 값을 쓰지 않는다
closed = 0.30   # 이보다 작으면 '감음'(눈 감기 클릭용)
reopen = 0.42   # 감은 뒤 이보다 커지면 다시 뜬 것

[face]  # 여러 사람이 보일 때 사용자 얼굴 고르기. 크기 = 두 눈 바깥 꼬리 사이 거리(px)
max_faces = 4      # 한 번에 찾는 얼굴 수. 1이면 MediaPipe가 처음 찾은 얼굴 하나만 본다(뒤 사람이 잡힐 수 있음)
min_size = 0.6     # 지금 사용자 얼굴보다 이 비율 이상 작은 얼굴은 무시(뒤에 있는 사람)
switch = 1.6     # 다른 얼굴이 지금 얼굴보다 이 배수 넘게 크면 그쪽으로 바꾼다(앞으로 온 사람)
forget_ms = 5000   # 사용자 얼굴이 이만큼 안 보이면 크기 기억을 버리고 가장 큰 얼굴을 다시 고른다

[click]
mode = "mouth"           # "mouth" = 입을 벌렸다 다물어 클릭, "eyes" = 양눈을 감았다 떠서 클릭
mouth_min_ms = 400       # 이보다 짧게 벌리면 무시(말하기 등)
mouth_max_ms = 4100      # 이보다 오래 벌리면 클릭 대신 메뉴. 진행 고리에서 보라색이 시작되는 곳
mouth_cooldown_ms = 400  # 클릭 직후 다시 클릭되지 않는 시간
eyes_min_ms = 600        # 눈 감기 클릭: 이보다 짧은 깜빡임은 무시
eyes_max_ms = 2000       # 이보다 오래 감으면 클릭 대신 메뉴
eyes_cooldown_ms = 800

[select]
dwell_ms = 50         # 같은 대상을 이만큼 계속 보면 선택(초록 테두리)
switch_margin_px = 20  # 새 대상이 지금 선택보다 이만큼 더 가까워야 선택을 바꾼다

[calibration]
lead_ms = 600      # 보정을 켜고 첫 점이 작아진 뒤 더 기다리는 시간
settle_ms = 800    # 점마다 눈이 옮겨 가는 시간(이 동안 값은 버린다). 점이 작아지는 애니메이션 시간도 이것
collect_ms = 600   # 그 뒤 값을 모으는 시간. 기록 34회로 다시 계산해 보니 800과 정확도 차이가 거의 없어(바퀴 사이 검증 중앙 +1px) 줄였다
min_records = 3    # 점마다 최소 표본 수(눈을 감아 모자라면 더 기다린다)
timeout_ms = 2100  # 그래도 이 시간이 지나면 다음 점으로. settle_ms + collect_ms보다 길게
max_error = 0.15   # 보정 오차(화면 비율)가 이보다 크면 '그래도 사용 / 다시 보정'을 묻는다
smoothing = 3      # 보정 곡선의 평활(얇은 판 스플라인). 작을수록 점에 맞춰 더 휘고, 클수록 직선(1차)에 가깝다. 0이면 1차 회귀만. 바꾼 값은 다음 보정부터 쓴다(팝업의 다시 보정)
# smooting = 0 # 1차 회귀로
[scroll]
band = 0.25    # 화면 위·아래 이 비율 안을 보면 스크롤
min_px = 150   # 띠 안쪽 끝의 속도(초당 px)
max_px = 1200  # 화면 끝·밖의 속도

[shortcuts]  # 메뉴 → 바로가기 화면의 사이트. "이름" = "주소" (http/https만, 위에서부터 최대 9개, 3개씩 한 줄)
"네이버" = "https://www.naver.com"
"유튜브" = "https://www.youtube.com"
"구글" = "https://www.google.com"
"테스트/게임" = "http://localhost:8765/demo"

[keyboard]
height = 75  # 가상 키보드 높이(화면 높이의 %)
