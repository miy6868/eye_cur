<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시선 클릭 테스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 32px;
    /* 아래 여백: 확장 패널(왼쪽 아래 고정)이 버튼을 가리지 않게 */
    padding: 48px 6vw 150px;
    background: #f6f7f9;
    color: #111827;
    font: 16px/1.5 system-ui, sans-serif;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: #6b7280; }
  /* 시선 오차가 커서 버튼을 크게, 멀리 떨어뜨려 둔다 */
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6vw; }
  button {
    min-height: 160px;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    background: #fff;
    color: inherit;
    font: 600 22px system-ui, sans-serif;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  button.hit { background: #111827; color: #fff; }
  output { font-size: 18px; font-weight: 600; }
  footer { display: flex; justify-content: flex-end; }
  input { width: 280px; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 12px; font: inherit; background: #fff; }
</style>
<header>
  <div>
    <h1>시선 클릭 테스트</h1>
    <p>버튼을 보고, 입을 1초 벌렸다 다무세요.</p>
  </div>
  <output id="result" aria-live="polite">클릭 0회</output>
</header>
<main class="grid">
  <button>1</button><button>2</button><button>3</button>
  <button>4</button><button>5</button><button>6</button>
</main>
<footer>
  <input placeholder="입력칸 테스트">
</footer>
<script>
  let count = 0;
  for (const button of document.querySelectorAll('button')) {
    button.onclick = () => {
      count++;
      document.querySelector('#result').textContent = `클릭 ${count}회 · ${button.textContent}번`;
      // 눌린 버튼을 잠깐 진하게 표시해서 어디가 클릭됐는지 바로 보이게 한다
      button.classList.add('hit');
      setTimeout(() => button.classList.remove('hit'), 600);
    };
  }
</script>
</html>
