<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 32px;
    /* 아래 여백: 확장 패널(왼쪽 아래 고정)이 버튼을 가리지 않게 */
    padding: 48px 6vw 150px;
    background: #f6f7f9;
    color: #111827;
    font: 16px/1.5 system-ui, sans-serif;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: #6b7280; }
  /* 난이도: 작은 버튼 12개를 화면 전체에 흩어 놓는다. 칸은 넓고 버튼만 작게 해서 가장자리 정확도도 본다 */
  .grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); align-content: space-evenly; justify-items: center; gap: 4vw; }
  button {
    width: 160px;
    height: 80px;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    background: #fff;
    color: inherit;
    font: 600 20px system-ui, sans-serif;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  button.hit { background: #111827; color: #fff; }
  output { font-size: 18px; font-weight: 600; }
  footer { display: flex; justify-content: flex-end; }
  input { width: 280px; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 12px; font: inherit; background: #fff; }
</style>
<header>
  <div>
    <h1>태스트<h1>
    <p> </p>
  </div>
  <output id="result" aria-live="polite">클릭 0회</output>
</header>
<main class="grid">
  <button>1</button><button>2</button><button>3</button><button>4</button>
  <button>5</button><button>6</button><button>7</button><button>8</button>
  <button>9</button><button>10</button><button>11</button><button>12</button>
</main>
<footer>
  <input placeholder="입력칸 테스트">
</footer>
<script>
  let count = 0;
  for (const button of document.querySelectorAll('button')) {
    button.onclick = () => {
      count++;
      document.querySelector('#result').textContent = `클릭 ${count}회 · ${button.textContent}번`;
      // 눌린 버튼을 잠깐 진하게 표시해서 어디가 클릭됐는지 바로 보이게 한다
      button.classList.add('hit');
      setTimeout(() => button.classList.remove('hit'), 600);
    };
  }
</script>
</html>
