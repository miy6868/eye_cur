<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>Gaze + Jev</title>
<style>
body{width:300px;margin:20px;font:14px/1.6 system-ui;color:#172331}h1{font-size:20px;margin:0}p{color:#536176}label{display:block}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #b4bfcb;border-radius:6px}button{padding:10px 14px;margin:12px 4px 0 0;border:0;border-radius:6px;cursor:pointer;background:#175cd3;color:white}button:last-of-type{background:#e9edf3;color:#172331}#status{font-size:12px;overflow-wrap:anywhere}small{color:#536176}
</style>
<h1>UniGaze + Jev</h1><p>CPU 시선 추적 · 입 벌렸다 다물기로 클릭</p>
<label for="token">로컬 서버 연결 토큰</label><input id="token" type="password" autocomplete="off" placeholder="start.ps1에 표시된 토큰">
<button id="start">시작</button><button id="stop">중지</button>
<p id="status" role="status">서버를 실행하고 토큰을 입력하세요.</p>
<small>보정은 저장되어 탭을 바꾸거나 ESC로 껐다 켜도 이어집니다. 시작하면 카메라에서 먼 양옆·아래에 여백을 두도록 Chrome 창을 줄이고, 중지하면 되돌립니다. 창 크기·위치가 바뀌면 새로 보정합니다. 시선이 어긋나면 화면의 다시 보정을 누르세요.</small>
<script src="core.js"></script><script src="popup.js"></script></html>
