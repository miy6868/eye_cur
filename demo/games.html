<!doctype html>

        <g transform="translate(-10 -125)">

          <path d="M150 260a50 50 0 0 1 100 0v55l-12 -10 -14 14 -12 -12 -12 14 -12 -12 -14 14 -12 -12 -12 10z" fill="url(#ghostBody)"/>

      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="tag">NIGHT WATCH</span>
      <h2>유령 쫓기</h2>
      <p>등불로 다가오는 유령을 바라봐서 태우세요.</p>
      <div class="meta"><span class="chip">시선만</span><span class="chip best" data-game="ghost"></span></div>
    </a>
    <a class="card" href="ship.html" style="--tint:#7dd3fc; --glow:rgba(125,211,252,.5)">

          <radialGradient id="nebA" cx="80%" cy="20%" r="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
          <radialGradient id="nebB" cx="15%" cy="70%" r="50%"><stop offset="0" stop-color="#a855f7" stop-opacity=".35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>

      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="tag">DEEP SPACE RUN</span>
      <h2>운석 피하기</h2>
      <p>우주선이 시선을 따라갑니다. 운석을 피하고 연료를 모으세요.</p>
      <div class="meta"><span class="chip">시선만</span><span class="chip best" data-game="ship"></span></div>
    </a>
    <a class="card" href="mole.html" style="--tint:#fcd34d; --glow:rgba(252,211,77,.5)">

          <radialGradient id="sun" cx="70%" cy="16%" r="40%"><stop offset="0" stop-color="#fff1d0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd49a" stop-opacity="0"/></radialGradient>

        <circle cx="181" cy="340" r="7" fill="#120a05"/><circle cx="219" cy="340" r="7" fill="#120a05"/>
        <circle cx="179" cy="337" r="2.2" fill="#fff"/><circle cx="217" cy="337" r="2.2" fill="#fff"/>
        <ellipse cx="200" cy="362" rx="24" ry="16" fill="#f1c9aa"/><ellipse cx="200" cy="354" rx="11" ry="7.5" fill="#e2557a"/>
        <path d="M128 410 A72 22 0 0 0 272 410 L330 420 A130 50 0 0 1 70 420Z" fill="#7a4f2c"/>
        <ellipse cx="166" cy="414" rx="13" ry="7" fill="#e6b896"/><ellipse cx="234" cy="414" rx="13" ry="7" fill="#e6b896"/>
        </g>
      </svg>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="tag">GOLDEN HOUR</span>
      <h2>두더지 잡기</h2>
      <p>두더지를 바라보고 입을 벌렸다 다물어 잡으세요.</p>
      <div class="meta"><span class="chip">시선 + 입 클릭</span><span class="chip best" data-game="mole"></span></div>
    </a>
  </main>
</div>
<script>
  for (const group of document.querySelectorAll('.stars')) {
    const height = Number(group.dataset.height) || 600;
    group.innerHTML = Array.from({length: 60}, () => `<circle cx="${Math.random() * 400}" cy="${Math.random() * height}" r="${(Math.random() ** 3 * 1.8 + .4).toFixed(2)}" fill="#fff" opacity="${(Math.random() * .7 + .2).toFixed(2)}"/>`).join('');
  }
  // 이 브라우저에 남은 최고 기록
  for (const chip of document.querySelectorAll('.chip.best')) {
    const score = Number(localStorage.getItem(`eye_cur:best:${chip.dataset.game}`)) || 0;
    if (score) chip.textContent = `최고 ${score.toLocaleString()}`; else chip.remove();
  }
</script>
</html>
