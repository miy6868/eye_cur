<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임</title>
<link rel="stylesheet" href="style.css">
<!-- 칸마다 실제 게임 화면(img/)을 보여 준다. 그림을 바꾸려면 게임을 캡처해 같은 이름으로 덮어쓴다 -->
<div class="page">
  <a class="back" href="index.html">← 처음으로</a>
  <main class="list">
    <a class="row" href="ghost.html">
      <img src="img/ghost.jpg" alt="">
      <div>
        <h2>유령 쫓기</h2>
        <p>가운데 등불로 다가오는 유령을 바라보면 타서 사라집니다. 클릭은 없습니다.</p>
        <div class="best" data-game="ghost"></div>
      </div>
    </a>
    <a class="row" href="ship.html">
      <img src="img/ship.jpg" alt="">
      <div>
        <h2>운석 피하기</h2>
        <p>우주선이 바라보는 쪽으로 움직입니다. 운석을 피하고 연료통을 모으세요.</p>
        <div class="best" data-game="ship"></div>
      </div>
    </a>
    <a class="row" href="mole.html">
      <img src="img/mole.jpg" alt="">
      <div>
        <h2>두더지 잡기</h2>
        <p>두더지가 나온 구멍을 잠깐 바라보면 잡습니다.</p>
        <div class="best" data-game="mole"></div>
      </div>
    </a>
    <a class="row" href="math.html">
      <img src="img/math.jpg" alt="">
      <div>
        <h2>덧셈 곱셈</h2>
        <p>문제의 답을 네 칸 중에서 찾아 시간 안에 바라봅니다.</p>
        <div class="best" data-game="math"></div>
      </div>
    </a>
  </main>
</div>
<script>
  // 이 브라우저에 남은 최고 기록
  for (const line of document.querySelectorAll('.best')) {
    const score = Number(localStorage.getItem(`eye_cur:best:${line.dataset.game}`)) || 0;
    line.textContent = score ? `최고 기록 ${score.toLocaleString()}` : '';
  }
</script>
</html>
