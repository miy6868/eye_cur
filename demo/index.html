<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eye_cur</title>
<link rel="stylesheet" href="style.css">
<!-- 보정이 끝나면 보이는 첫 화면. 좌우 큰 카드라 시선으로도 마우스로도 쉽게 고른다 -->
<div class="backdrop"></div>
<div class="page">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 36 36" fill="none"><path d="M3 18s5.5-10 15-10 15 10 15 10-5.5 10-15 10S3 18 3 18Z" stroke="#c7d2fe" stroke-width="2.2"/><circle cx="18" cy="18" r="5.5" fill="#8ea8ff"/><circle cx="20" cy="16" r="1.6" fill="#fff"/></svg>
      eye_cur
    </div>
  </header>
  <div class="headline">
    <h1>무엇을 해 볼까요?</h1>
    <p>카드를 바라보고 입을 벌렸다 다물면 들어갑니다. 마우스로 눌러도 됩니다.</p>
  </div>
  <main class="cards">
    <a class="card" href="test.html" style="--tint:#93c5fd; --glow:rgba(96,165,250,.55)">
      <svg class="art" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="testBg" cx="72%" cy="28%" r="85%"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#0b1a3d"/><stop offset="1" stop-color="#050912"/></radialGradient>
          <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="rgba(147,197,253,.11)"/></pattern>
          <radialGradient id="dot"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".3" stop-color="#60a5fa" stop-opacity=".8"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="600" height="600" fill="url(#testBg)"/>
        <rect width="600" height="600" fill="url(#grid)"/>
        <g transform="translate(400 230)" fill="none" stroke="#93c5fd">
          <circle r="150" stroke-opacity=".12"/><circle r="100" stroke-opacity=".2"/><circle r="52" stroke-opacity=".38" stroke-dasharray="4 8"/>
          <path d="M-190 0H-70M70 0H190M0-190V-70M0 70V190" stroke-opacity=".3"/>
          <rect x="-120" y="40" width="96" height="50" rx="12" stroke-opacity=".35"/><rect x="30" y="-110" width="96" height="50" rx="12" stroke="#4ade80" stroke-width="3" stroke-opacity=".8"/>
        </g>
        <circle cx="458" cy="145" r="46" fill="url(#dot)"/>
      </svg>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="tag">FUNCTION CHECK</span>
      <h2>테스트</h2>
      <p>버튼 12개와 입력칸으로 시선 정확도와 입 클릭을 점검합니다.</p>
      <div class="meta"><span class="chip">버튼 12개</span><span class="chip">입력칸</span></div>
    </a>
    <a class="card" href="games.html" style="--tint:#f0abfc; --glow:rgba(217,70,239,.5)">
      <svg class="art" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="gameBg" cx="30%" cy="20%" r="90%"><stop offset="0" stop-color="#7e22ce"/><stop offset=".45" stop-color="#2a0b4a"/><stop offset="1" stop-color="#07040f"/></radialGradient>
          <radialGradient id="neb" cx="75%" cy="65%" r="45%"><stop offset="0" stop-color="#ec4899" stop-opacity=".45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
          <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbcfe8"/><stop offset=".5" stop-color="#c026d3"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
        </defs>
        <rect width="600" height="600" fill="url(#gameBg)"/>
        <rect width="600" height="600" fill="url(#neb)"/>
        <g class="stars"></g>
        <g transform="translate(400 210) rotate(-18)">
          <ellipse rx="170" ry="36" fill="none" stroke="#f5d0fe" stroke-opacity=".35" stroke-width="10"/>
          <circle r="96" fill="url(#planet)"/>
          <path d="M-170 0a170 36 0 0 0 340 0" fill="none" stroke="#f5d0fe" stroke-opacity=".55" stroke-width="10"/>
        </g>
      </svg>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="tag">PLAY</span>
      <h2>게임</h2>
      <p>시선으로 하는 게임 세 가지. 유령 쫓기, 운석 피하기, 두더지 잡기.</p>
      <div class="meta"><span class="chip">3개</span><span class="chip">효과음</span></div>
    </a>
  </main>
</div>
<script>
  // 카드 배경의 별을 흩뿌린다
  for (const group of document.querySelectorAll('.stars')) {
    group.innerHTML = Array.from({length: 70}, () => `<circle cx="${Math.random() * 600}" cy="${Math.random() * 600}" r="${(Math.random() ** 3 * 2 + .4).toFixed(2)}" fill="#fff" opacity="${(Math.random() * .7 + .2).toFixed(2)}"/>`).join('');
  }
</script>
</html>
