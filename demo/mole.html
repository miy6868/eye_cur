<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두더지 잡기</title>
<link rel="stylesheet" href="style.css">
<!-- 두더지 잡기: 클릭 없이 두더지가 나온 구멍을 잠깐 바라보면(응시) 잡는다. 시선 좌표는 gaze.js(없으면 마우스) -->
<canvas id="canvas"></canvas>
<div class="hud">
  <a class="stat exit" href="games.html">← 목록</a>
  <span class="grow"></span>
  <span class="stat">연속 <b id="combo">-</b></span>
  <span class="stat" id="timePill">남은 시간 <b id="time">60</b></span>
  <span class="stat">점수 <b id="score">0</b></span>
</div>
<div class="banner" id="banner" hidden></div>
<section class="screen" id="start">
  <div class="panel">
    <h1>두더지 잡기</h1>
    <p>두더지가 나온 구멍을 잠깐 바라보면 잡습니다. 클릭은 필요 없습니다. 마우스를 올려 두어도 됩니다.</p>
    <ul class="rules">
      <li>60초 동안 잡은 만큼 점수를 받습니다.</li>
      <li>황금 두더지는 300점입니다.</li>
      <li>놓치지 않고 연달아 잡으면 점수가 조금씩 더 붙습니다.</li>
      <li>두더지 둘레의 고리가 다 차면 잡힙니다. 눈을 떼면 고리가 천천히 줄어듭니다.</li>
    </ul>
    <div class="actions"><button class="cta" id="play">시작</button></div>
    <p id="startBest"></p>
  </div>
</section>
<section class="screen" id="over" hidden>
  <div class="panel">
    <h1 id="result"></h1>
    <p id="summary"></p>
    <p id="overBest"></p>
    <div class="actions"><button class="cta" id="again">다시 하기</button><a class="alt" href="games.html">게임 목록</a></div>
  </div>
</section>
<script src="gaze.js"></script>
<script src="kit.js"></script>
<script>
  const GAME_S = 60;
  const DWELL = .5;  // 이만큼(초) 바라보면 잡는다
  const DECAY = 1.5; // 눈을 떼면 고리가 줄어드는 빠르기(채우는 빠르기의 배수). 바로 0으로 하면 시선 떨림에 매번 처음부터였다
  const LAYOUT = [[.25, .47, .78], [.5, .47, .78], [.75, .47, .78], [.2, .8, 1], [.5, .8, 1], [.8, .8, 1]]; // x, y(화면 비율), 크기(뒷줄은 작게)
  const parts = new Particles(), popups = new Popups();
  const scene = {};
  const holes = LAYOUT.map(() => ({}));
  let state = 'attract', t = 0, readyUntil = 0, startAt = 0, next = 0, lastTick = 0;
  let moles = [], current = null, score = 0, caught = 0, missed = 0, combo = 0, maxCombo = 0;
  const view = setupCanvas($('#canvas'), build);
  const {ctx} = view;

  function moundPath(g, h) { g.ellipse(h.x, h.y + h.ry * .25, h.rx * 1.5, h.ry * 2.2, 0, 0, TAU); }
  // 뒤 둔덕과 앞 둔덕이 같은 흙 색이어야 이음매가 안 보인다
  function soil(g, hole) {
    const grad = g.createRadialGradient(hole.x + hole.rx * .3, hole.y - hole.ry * 1.2, 0, hole.x, hole.y, hole.rx * 1.6);
    grad.addColorStop(0, '#b07a4a'); grad.addColorStop(.55, '#7a4f2c'); grad.addColorStop(1, '#3d2614');
    return grad;
  }
  function build({w, h}) {
    const base = Math.min(w * .1, h * .15);
    LAYOUT.forEach(([fx, fy, s], i) => {
      Object.assign(holes[i], {x: fx * w, y: fy * h, rx: base * s, ry: base * s * .36});
    });
    const horizon = h * .36, sun = [w * .7, h * .31];
    scene.back = sprite(w, h, g => {
      const sky = g.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, '#2b3b74'); sky.addColorStop(.55, '#c9785e'); sky.addColorStop(1, '#ffd49a');
      g.fillStyle = sky; g.fillRect(0, 0, w, horizon + 2);
      const r = Math.min(w, h) * .05;
      const halo = g.createRadialGradient(...sun, r, ...sun, r * 12);
      halo.addColorStop(0, 'rgba(255,214,150,.75)'); halo.addColorStop(1, 'rgba(255,214,150,0)');
      g.fillStyle = halo; g.fillRect(0, 0, w, h);
      g.fillStyle = '#fff4dc'; g.beginPath(); g.arc(...sun, r, 0, TAU); g.fill();
      // 언덕: 멀수록 하늘색에 가깝게(대기)
      [['#c4836f', .27, .04], ['#8d6b55', .31, .05], ['#4c5a30', .345, .035]].forEach(([color, top, amp], k) => {
        const a = rand(0, 9), b = rand(0, 9);
        const ridge = x => h * top + Math.sin(x / w * 5 + a) * h * amp * .5 + Math.sin(x / w * 13 + b) * h * amp * .25;
        g.fillStyle = color; g.beginPath(); g.moveTo(0, h);
        for (let x = 0; x <= w; x += 8) g.lineTo(x, ridge(x));
        g.lineTo(w, h); g.fill();
        if (k === 2) for (let x = 0; x < w; x += rand(10, 26)) { const s = rand(8, 20); g.beginPath(); g.arc(x, ridge(x) - s * .6, s, 0, TAU); g.fill(); } // 먼 나무 줄
      });
      const field = g.createLinearGradient(0, horizon, 0, h);
      field.addColorStop(0, '#c2b05c'); field.addColorStop(.2, '#a3a94c'); field.addColorStop(.45, '#759639'); field.addColorStop(.75, '#4a7a2d'); field.addColorStop(1, '#2d5520');
      g.fillStyle = field; g.fillRect(0, horizon, w, h - horizon);
      const glare = g.createRadialGradient(sun[0], horizon, 0, sun[0], horizon, w * .55);
      glare.addColorStop(0, 'rgba(255,200,120,.45)'); glare.addColorStop(1, 'rgba(255,200,120,0)');
      g.fillStyle = glare; g.fillRect(0, horizon, w, h - horizon);
      // 풀잎: 가까울수록 길고 진하다(원근)
      g.lineCap = 'round';
      for (let i = 0; i < 5000; i++) {
        const k = Math.random() ** .7, y = horizon + k * (h - horizon), x = rand(-10, w + 10), len = 2 + k * 16;
        g.strokeStyle = `hsla(${rand(70, 100)},${rand(35, 55)}%,${rand(18, 42) + (1 - k) * 18}%,${rand(.35, .8)})`;
        g.lineWidth = .6 + k * 1.6;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(-1, 1) * len * .4, y - len); g.stroke();
      }
      for (const hole of holes) {
        const shadow = g.createRadialGradient(hole.x, hole.y + hole.ry, 0, hole.x, hole.y + hole.ry, hole.rx * 1.9);
        shadow.addColorStop(0, 'rgba(20,28,8,.45)'); shadow.addColorStop(1, 'rgba(20,28,8,0)');
        g.fillStyle = shadow; g.fillRect(hole.x - hole.rx * 2, hole.y - hole.rx, hole.rx * 4, hole.rx * 2.5);
        g.fillStyle = soil(g, hole); g.beginPath(); moundPath(g, hole); g.fill();
        for (let i = 0; i < 14; i++) { // 흙덩이
          const a = rand(0, TAU), d = rand(1.1, 1.6);
          g.fillStyle = `rgba(${rand(70, 140)},${rand(45, 90)},${rand(20, 50)},.9)`;
          g.beginPath(); g.ellipse(hole.x + Math.cos(a) * hole.rx * d, hole.y + hole.ry * .3 + Math.sin(a) * hole.ry * d * 1.8, rand(2, 6), rand(1.5, 4), 0, 0, TAU); g.fill();
        }
        const pit = g.createRadialGradient(hole.x, hole.y + hole.ry * .4, 0, hole.x, hole.y, hole.rx);
        pit.addColorStop(0, '#050201'); pit.addColorStop(.7, '#1a0d05'); pit.addColorStop(1, '#3a2010');
        g.fillStyle = pit; g.beginPath(); g.ellipse(hole.x, hole.y, hole.rx, hole.ry, 0, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(255,214,160,.35)'; g.lineWidth = 2; // 해가 비추는 오른쪽 위 가장자리
        g.beginPath(); g.ellipse(hole.x, hole.y, hole.rx, hole.ry, 0, Math.PI * 1.1, Math.PI * 1.95); g.stroke();
      }
    });
    // 앞쪽 흙 둔덕(두더지 몸 아래를 가린다)과 화면 앞 풀
    scene.front = sprite(w, h, g => {
      for (const hole of holes) {
        g.save();
        g.beginPath(); g.rect(0, hole.y, w, h); g.clip();
        g.fillStyle = soil(g, hole); g.beginPath(); moundPath(g, hole); g.ellipse(hole.x, hole.y, hole.rx, hole.ry, 0, 0, TAU); g.fill('evenodd');
        g.strokeStyle = 'rgba(255,220,170,.28)'; g.lineWidth = 2;
        g.beginPath(); g.ellipse(hole.x, hole.y, hole.rx, hole.ry, 0, 0, Math.PI); g.stroke();
        g.restore();
      }
      g.lineCap = 'round';
      for (let i = 0; i < 260; i++) {
        const x = rand(-20, w + 20), y = h + rand(0, 20), len = rand(30, 90);
        g.strokeStyle = `hsla(${rand(80, 110)},45%,${rand(8, 18)}%,.95)`; g.lineWidth = rand(2, 5);
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + rand(-20, 20), y - len * .6, x + rand(-30, 30), y - len); g.stroke();
      }
    });
    scene.vignette = vignette(w, h, [30, 10, 0], .55);
  }

  function upTime() { return state === 'play' ? 2 - .8 * Math.min(1, (t - startAt) / GAME_S) : 1.3; } // 2초 → 끝날 무렵 1.2초(눈을 옮기고 DWELL만큼 바라볼 시간)
  // 바라보는 영역 = 화면에 그리는 고리 안(원). 시선 오차가 있어 두더지 그림보다 꽤 넓다. 구멍 폭 1.05배 원은 작았다(사용자)
  const LOOK_R = 1.6; // 구멍 반지름(rx)의 배수
  const ringOf = hole => ({x: hole.x, y: hole.y - hole.rx * .55, r: hole.rx * LOOK_R});
  function looking(hole) {
    const ring = ringOf(hole);
    return Math.hypot(gaze.x - ring.x, gaze.y - ring.y) < ring.r;
  }
  function spawn() {
    const choices = holes.filter(h => h !== moles.at(-1)?.hole);
    const hole = pick(choices), kind = state === 'play' && Math.random() < .12 ? 'gold' : 'normal';
    current = {hole, kind, born: t, until: t + upTime(), rise: 0, caught: false, hitAt: null, phase: rand(0, TAU), dwell: 0};
    moles.push(current);
    if (state === 'play') Sound.play('pop');
    parts.emit(hole.x, hole.y, {count: 10, color: [150, 105, 60], speed: [40, 140], angle: -Math.PI / 2, spread: 1.1, gravity: 600, life: [.3, .6], size: [1.5, 3.5], jitter: hole.rx * .5});
  }
  function whack(m) {
    const {hole} = m;
    m.caught = true; m.hitAt = t; current = null; next = t + .55;
    combo++; caught++; maxCombo = Math.max(maxCombo, combo);
    const gold = m.kind === 'gold', points = (gold ? 300 : 100) + 20 * Math.min(combo - 1, 10);
    score += points;
    const top = hole.y - hole.rx * 1.1;
    popups.add(hole.x, top, gold ? `황금! +${points}` : `+${points}`, {color: gold ? '#fde047' : '#fff', size: gold ? 38 : 32});
    if (combo >= 3) popups.add(hole.x, top - 40, `${combo}연속`, {color: '#fdba74', size: 22, life: 1.1});
    parts.emit(hole.x, top + hole.rx * .4, {count: 18, glow: true, color: gold ? [255, 220, 80] : [255, 240, 180], speed: [80, 300], life: [.25, .55], size: [2, 4]});
    parts.emit(hole.x, hole.y, {count: 22, color: [120, 80, 45], speed: [150, 420], angle: -Math.PI / 2, spread: 1.2, gravity: 1100, life: [.5, 1], size: [2, 5], drag: .5});
    parts.emit(hole.x, hole.y, {count: 10, color: [215, 190, 150], speed: [30, 120], life: [.6, 1.1], size: [8, 16], grow: 1.6, alpha: .45});
    shake.add(gold ? 9 : 6);
    Sound.play('whack'); if (gold) Sound.play('gold');
  }

  function start() {
    state = 'ready'; readyUntil = t + 1.4;
    moles = []; current = null; score = 0; caught = 0; missed = 0; combo = 0; maxCombo = 0;
    $('#start').hidden = $('#over').hidden = true;
    banner('준비', '두더지가 나오면 바라보세요', 0);
    Sound.play('start');
  }
  function end() {
    state = 'over'; current = null; next = t + 1;
    const rec = best('mole', score);
    $('#result').textContent = `${score.toLocaleString()}점`;
    $('#summary').textContent = `시간이 끝났습니다. ${caught}마리를 잡고 ${missed}마리를 놓쳤습니다. 가장 길게 이어 잡은 것은 ${maxCombo}마리입니다.`;
    $('#overBest').textContent = rec.isNew ? '새 최고 기록입니다.' : rec.best ? `최고 기록 ${rec.best.toLocaleString()}점` : '';
    $('#over').hidden = false;
    Sound.play('over');
  }
  function update(dt) {
    if (state === 'ready' && t > readyUntil) { state = 'play'; startAt = t; next = t + .3; banner('시작!', '', 700); Sound.play('go'); }
    if (state === 'play') {
      const left = GAME_S - (t - startAt);
      if (left <= 10 && Math.ceil(left) !== lastTick) { lastTick = Math.ceil(left); Sound.play('tick'); }
      if (left <= 0) end();
    }
    if (current && state === 'play' && t < current.until && current.rise > .5) { // 응시: 바라보면 고리가 차고, 떼면 줄어든다. 시선이 끊긴 동안(얼굴 잃음·입 벌림)은 그대로 둔다
      if (looking(current.hole)) current.dwell += dt / DWELL;
      else if (!gazeLost()) current.dwell = Math.max(0, current.dwell - dt / DWELL * DECAY);
      if (current.dwell >= 1) whack(current);
    }
    if (current && !current.caught && t > current.until) { // 끝내 못 잡음
      if (state === 'play') {
        missed++; combo = 0;
        popups.add(current.hole.x, current.hole.y - current.hole.rx * .6, '놓침', {color: '#d6d3d1', size: 22, life: .8});
        Sound.play('miss');
      }
      current = null; next = t + rand(.1, .4);
    }
    if (!current && state !== 'ready' && t >= next) spawn();
    for (const m of moles) {
      if (m.hitAt !== null) { const k = t - m.hitAt; m.rise = k < .5 ? 1 : Math.max(0, 1 - (k - .5) / .22); m.done = k > .75; }
      else if (t < m.until) { const k = (t - m.born) / .22; m.rise = k < 1 ? easeOutBack(k) : 1; }
      else { const k = (t - m.until) / .18; m.rise = Math.max(0, 1 - k * k); m.done = k >= 1 && m !== current; }
    }
    moles = moles.filter(m => !m.done);
    parts.update(dt); popups.update(dt);
  }

  function drawMole(m) {
    const {hole} = m, s = hole.rx / 100, hit = m.hitAt !== null, gold = m.kind === 'gold';
    if (m.rise <= 0) return;
    const bob = hit ? 0 : Math.sin(t * 5 + m.phase) * 3;
    const top = hole.y + (70 - m.rise * 185 + bob) * s;
    ctx.save();
    // 구멍 위쪽과 구멍 안만 보이게 자른다(아래는 땅속)
    ctx.beginPath(); ctx.rect(hole.x - hole.rx * 2, 0, hole.rx * 4, hole.y); ctx.ellipse(hole.x, hole.y, hole.rx, hole.ry, 0, 0, TAU); ctx.clip();
    if (gold) light(ctx, [255, 210, 80], hole.x, top + 20 * s, 120 * s, .55);
    ctx.save();
    ctx.translate(hole.x, top);
    const squash = hit ? Math.max(0, 1 - (t - m.hitAt) / .5) : 0;
    ctx.scale(s * (1 + squash * .15), s * (1 - squash * .2));
    const fur = ctx.createRadialGradient(-22, -10, 5, 0, 30, 95);
    fur.addColorStop(0, gold ? '#fff0a8' : '#b07a55'); fur.addColorStop(.5, gold ? '#e2ac1f' : '#6b4329'); fur.addColorStop(1, gold ? '#7a5604' : '#2c1a0e');
    ctx.fillStyle = fur;
    for (const ex of [-44, 44]) { ctx.beginPath(); ctx.arc(ex, -14, 13, 0, TAU); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(0, 50, 66, 80, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,214,160,.45)'; ctx.lineWidth = 4; // 해 쪽(오른쪽) 테두리 빛
    ctx.beginPath(); ctx.ellipse(0, 50, 64, 78, 0, -Math.PI * .45, Math.PI * .05); ctx.stroke();
    ctx.fillStyle = gold ? 'rgba(255,248,200,.55)' : 'rgba(222,186,150,.5)';
    ctx.beginPath(); ctx.ellipse(0, 72, 40, 52, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,120,.3)';
    for (const cx of [-38, 38]) { ctx.beginPath(); ctx.arc(cx, 20, 9, 0, TAU); ctx.fill(); }
    if (hit) { // 맞으면 눈이 X
      ctx.strokeStyle = '#1a0f08'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (const ex of [-22, 22]) { ctx.beginPath(); ctx.moveTo(ex - 7, -7); ctx.lineTo(ex + 7, 7); ctx.moveTo(ex + 7, -7); ctx.lineTo(ex - 7, 7); ctx.stroke(); }
    } else {
      const look = Math.sin(t * 1.7 + m.phase) * 3;
      for (const ex of [-22, 22]) {
        ctx.fillStyle = '#120a05'; ctx.beginPath(); ctx.arc(ex + look, 0, 8.5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + look - 2.5, -3, 2.8, 0, TAU); ctx.fill();
      }
    }
    ctx.fillStyle = '#f1c9aa'; ctx.beginPath(); ctx.ellipse(0, 24, 30, 20, 0, 0, TAU); ctx.fill();
    const nose = ctx.createRadialGradient(-3, 10, 1, 0, 14, 13);
    nose.addColorStop(0, '#ff9ab5'); nose.addColorStop(1, '#c23a63');
    ctx.fillStyle = nose; ctx.beginPath(); ctx.ellipse(0, 14, 13, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fffaf0'; ctx.fillRect(-6, 33, 5, 9); ctx.fillRect(1, 33, 5, 9);
    ctx.strokeStyle = 'rgba(40,25,15,.55)'; ctx.lineWidth = 1.5;
    for (const side of [-1, 1]) for (const dy of [-5, 0, 5]) { ctx.beginPath(); ctx.moveTo(side * 18, 24 + dy * .4); ctx.lineTo(side * 52, 20 + dy * 1.6); ctx.stroke(); }
    ctx.restore(); // 크기만 되돌리고 자르기는 남긴다
    const pit = ctx.createLinearGradient(0, hole.y - hole.ry * .6, 0, hole.y + hole.ry); // 구멍 속은 그늘
    pit.addColorStop(0, 'rgba(12,6,2,0)'); pit.addColorStop(1, 'rgba(12,6,2,.92)');
    ctx.fillStyle = pit; ctx.fillRect(hole.x - hole.rx, hole.y - hole.ry, hole.rx * 2, hole.ry * 2);
    ctx.restore();
    if (hit && t - m.hitAt < .7) { // 머리 위를 도는 별
      for (let k = 0; k < 3; k++) {
        const a = t * 7 + k * TAU / 3, sx = hole.x + Math.cos(a) * 46 * s, sy = top - 48 * s + Math.sin(a) * 12 * s;
        light(ctx, [255, 230, 120], sx, sy, 16 * s, .9);
        ctx.fillStyle = '#fff7c2'; ctx.beginPath(); ctx.arc(sx, sy, 4 * s, 0, TAU); ctx.fill();
      }
    }
  }
  function drawRing(m) { // 응시 진행 고리. 두더지가 나와 있는 동안 늘 옅게 그려 바라볼 영역을 보여 준다
    if (m.hitAt !== null || m.rise <= .5 || t > m.until) return;
    const {x, y, r} = ringOf(m.hole);
    ctx.save();
    ctx.lineWidth = Math.max(4, m.hole.rx * .07); ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = m.kind === 'gold' ? '#fde047' : '#fff';
    if (m.dwell > 0) { ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, m.dwell)); ctx.stroke(); }
    ctx.restore();
  }
  function drawPaws(m) { // 구멍 가장자리를 짚은 앞발(앞쪽 둔덕 위에 그린다)
    if (m.rise < .85 || m.hitAt !== null) return;
    const {hole} = m, s = hole.rx / 100;
    ctx.fillStyle = m.kind === 'gold' ? '#f5d77a' : '#e6b896';
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(hole.x + side * 40 * s, hole.y + 4 * s, 15 * s, 9 * s, 0, 0, TAU); ctx.fill(); }
  }
  function draw(dt) {
    const {w, h} = view;
    ctx.save();
    shake.apply(ctx, dt);
    ctx.drawImage(scene.back, -20, -20, w + 40, h + 40);
    for (const m of moles) drawMole(m);
    ctx.drawImage(scene.front, -20, -20, w + 40, h + 40);
    for (const m of moles) drawPaws(m);
    for (const m of moles) drawRing(m);
    parts.draw(ctx);
    popups.draw(ctx);
    ctx.restore();
    ctx.drawImage(scene.vignette, 0, 0, w, h);
  }
  let shown = {};
  function hud() {
    const left = state === 'play' ? Math.max(0, Math.ceil(GAME_S - (t - startAt))) : state === 'over' ? 0 : GAME_S;
    const values = {score: score.toLocaleString(), left, combo: combo >= 2 ? `×${combo}` : '-'};
    if (values.score !== shown.score) $('#score').textContent = values.score;
    if (values.combo !== shown.combo) $('#combo').textContent = values.combo;
    if (values.left !== shown.left) { $('#time').textContent = values.left; $('#timePill').classList.toggle('danger', state === 'play' && left <= 10); }
    shown = values;
  }
  const tick = clock();
  function frame(now) {
    const dt = tick(now);
    t += dt;
    update(dt);
    draw(dt);
    hud();
    requestAnimationFrame(frame);
  }
  const record0 = best('mole', 0).best;
  $('#startBest').textContent = record0 ? `최고 기록 ${record0.toLocaleString()}점` : '';
  $('#play').onclick = $('#again').onclick = start;
  requestAnimationFrame(frame);
</script>
</html>
