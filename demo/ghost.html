<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유령 쫓기</title>
<link rel="stylesheet" href="style.css">
<style>
  body { --tint: #fbbf77; --tint2: #fde68a; --tint-glow: rgba(251, 191, 119, .45); }
  .flames { display: inline-flex; gap: 4px; }
  .flames svg { width: 20px; height: 26px; color: #fbbf77; filter: drop-shadow(0 0 6px rgba(251, 191, 119, .8)); transition: opacity .3s, filter .3s; }
  .flames svg.out { opacity: .2; filter: none; }
</style>
<!-- 유령 쫓기: 가장자리에서 등불로 다가오는 유령을 바라보면 탄다. 클릭이 없고, 유령 근처만 봐도 되게 판정을 넓게 둔다 -->
<canvas id="canvas"></canvas>
<div class="hud">
  <a class="pill exit" href="games.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>목록</a>
  <span class="grow"></span>
  <span class="pill"><small>LIGHT</small><span class="flames" id="flames"></span></span>
  <span class="pill"><small>TIME</small><span id="time">0</span></span>
  <span class="pill"><small>SCORE</small><span id="score">0</span></span>
</div>
<div class="banner" id="banner" hidden></div>
<div class="banner" id="notice" hidden><div>시선을 찾는 중<small>화면을 바라보고 입을 다물면 이어집니다</small></div></div>
<section class="screen" id="start">
  <div class="panel">
    <p class="kicker">NIGHT WATCH</p>
    <h1>유령 쫓기</h1>
    <p class="lead">안개 낀 숲에서 유령들이 등불을 노립니다. 당신의 시선은 빛이에요. 바라보는 유령은 타서 사라집니다.</p>
    <ul class="howto">
      <li><b>시선</b>유령을 바라보면 소멸</li>
      <li><b>콤보</b>연달아 없애면 점수 배로</li>
      <li><b>등불</b>울타리에 세 번 닿으면 꺼짐</li>
    </ul>
    <div class="actions"><button class="cta" id="play">시작하기</button></div>
    <p class="record" id="startBest"></p>
  </div>
</section>
<section class="screen" id="over" hidden>
  <div class="panel">
    <p class="kicker">THE LIGHT WENT OUT · 등불이 꺼졌습니다</p>
    <div class="bigscore" id="final">0</div>
    <span class="newbest" id="newbest" hidden>NEW RECORD</span>
    <div class="stats" id="stats"></div>
    <div class="actions"><button class="cta" id="again">다시 하기</button><a class="alt" href="games.html">게임 목록</a></div>
    <p class="record" id="overBest"></p>
  </div>
</section>
<script src="gaze.js"></script>
<script src="kit.js"></script>
<script>
  const MELT_S = .45;      // 바라보기 시작해서 다 탈 때까지(보통 유령)
  const LOOK_MARGIN = 70;  // 유령 둘레 밖으로 이만큼까지 바라본 것으로 친다(시선 오차)
  // 유령이 이 울타리에 닿으면 등불이 약해진다. 울타리가 가장 큰 유령의 시선 판정(반지름 + LOOK_MARGIN)보다 넓어서 등불만 보고 버틸 수는 없다
  const FENCE = 170;
  const TYPES = {
    ghost: {body: [228, 238, 255], halo: [150, 200, 255], r: [34, 46], speed: 1, hp: 1, points: 1},
    wisp: {body: [205, 255, 240], halo: [90, 255, 200], r: [22, 27], speed: 1.6, hp: .7, points: 2},
    wraith: {body: [228, 216, 255], halo: [170, 130, 255], r: [60, 70], speed: .6, hp: 2.4, points: 4},
  };
  const FLAME = '<svg viewBox="0 0 20 26"><path fill="currentColor" d="M10 1c1 5 7 8 7 15a7 7 0 0 1-14 0c0-4 2-6 3-8 0 3 1 4 2 4 0-4 1-8 2-11z"/></svg>';
  const parts = new Particles(), popups = new Popups();
  const scene = {};
  let state = 'attract', t = 0, readyUntil = 0, endAt = 0, spawnIn = 0, sizzleIn = 0, hurtFlash = 0, power = 1;
  let ghosts = [], lives = 3, score = 0, elapsed = 0, kills = 0, combo = 0, maxCombo = 0, lastKill = -9;
  let fogs = [], flies = [];
  const view = setupCanvas($('#canvas'), build);
  const {ctx} = view;

  function pine(g, x, base, height, color) {
    g.fillStyle = color;
    g.fillRect(x - height * .018, base - height * .16, height * .036, height * .17);
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const y = base - height * .1 - i * height * .15, half = height * .3 * (1 - i / 7) * rand(.85, 1.1);
      g.moveTo(x - half, y); g.lineTo(x - half * .35, y - height * .05); g.lineTo(x, y - height * .28); g.lineTo(x + half * .35, y - height * .05); g.lineTo(x + half, y);
    }
    g.fill();
  }
  function build({w, h}) {
    scene.sky = sprite(w, h, g => {
      const sky = g.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#02040b'); sky.addColorStop(.5, '#081424'); sky.addColorStop(1, '#10202f');
      g.fillStyle = sky; g.fillRect(0, 0, w, h);
      for (let i = 0; i < w * h / 7000; i++) { g.fillStyle = `rgba(220,230,255,${rand(.1, .6)})`; const s = rand(.6, 1.7); g.fillRect(rand(0, w), rand(0, h * .55), s, s); }
      const mx = w * .8, my = h * .2, mr = Math.min(w, h) * .05;
      const halo = g.createRadialGradient(mx, my, mr, mx, my, mr * 9);
      halo.addColorStop(0, 'rgba(170,200,255,.22)'); halo.addColorStop(1, 'rgba(170,200,255,0)');
      g.fillStyle = halo; g.fillRect(0, 0, w, h);
      const disc = g.createRadialGradient(mx - mr * .3, my - mr * .3, 0, mx, my, mr);
      disc.addColorStop(0, '#fbfdff'); disc.addColorStop(1, '#bfcadb');
      g.fillStyle = disc; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
      for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(120,135,160,.18)'; g.beginPath(); g.arc(mx + rand(-.6, .6) * mr, my + rand(-.6, .6) * mr, rand(.08, .2) * mr, 0, TAU); g.fill(); }
      // 먼 숲에서 가까운 숲으로: 멀수록 밝고 푸르며(대기), 층 사이에 안개 띠
      const layers = [
        {base: .64, height: .15, color: '#13253a', step: 14},
        {base: .74, height: .22, color: '#0b1828', step: 24},
        {base: .9, height: .34, color: '#040a12', step: 46},
      ];
      layers.forEach((layer, k) => {
        const base = h * layer.base, height = h * layer.height;
        g.fillStyle = layer.color; g.fillRect(0, base - 2, w, h - base + 2);
        for (let x = -20; x < w + 40; x += layer.step * rand(.6, 1.4)) {
          if (k === 2 && x > w * .2 && x < w * .8) continue; // 가장 가까운 나무는 양옆에만 둬서 가운데를 비운다
          pine(g, x, base + rand(0, height * .1), height * rand(.6, 1.1), layer.color);
        }
        const fog = g.createLinearGradient(0, base - height * .5, 0, base + height * .2);
        fog.addColorStop(0, 'rgba(140,165,200,0)'); fog.addColorStop(.6, `rgba(140,165,200,${.12 - k * .03})`); fog.addColorStop(1, 'rgba(140,165,200,0)');
        g.fillStyle = fog; g.fillRect(0, base - height * .5, w, height * .7);
      });
    });
    scene.fog = sprite(700, 220, g => {
      g.scale(1, 220 / 700); // 둥근 빛을 납작하게 눌러 안개 덩어리로
      const grad = g.createRadialGradient(350, 350, 0, 350, 350, 350);
      grad.addColorStop(0, 'rgba(175,195,225,.55)'); grad.addColorStop(1, 'rgba(175,195,225,0)');
      g.fillStyle = grad; g.fillRect(0, 0, 700, 700);
    }, .25);
    scene.vignette = vignette(w, h, [0, 0, 4], .85);
    scene.blood = vignette(w, h, [180, 20, 30], .7);
    fogs = Array.from({length: 7}, (_, i) => ({x: rand(0, w), y: rand(h * .35, h * .95), speed: rand(8, 22) * (Math.random() < .5 ? 1 : -1), scale: rand(1.2, 2.4), a: rand(.12, .28), front: i % 2 === 0}));
    flies = Array.from({length: 18}, () => ({x: rand(0, w), y: rand(h * .55, h * .95), phase: rand(0, TAU), speed: rand(.3, .8)}));
  }

  function start() {
    state = 'ready'; readyUntil = t + 1.5;
    ghosts = []; lives = 3; score = 0; elapsed = 0; kills = 0; combo = 0; maxCombo = 0; spawnIn = .3;
    $('#start').hidden = $('#over').hidden = true;
    banner('준비', '유령을 바라보면 타서 사라집니다', 0);
    Sound.play('start');
  }
  function spawn() {
    const {w, h} = view, side = Math.floor(Math.random() * 4), k = Math.random();
    const kind = elapsed > 45 && Math.random() < .2 ? 'wraith' : elapsed > 25 && Math.random() < .3 ? 'wisp' : 'ghost';
    const type = TYPES[kind], r = rand(...type.r);
    const [x, y] = [[k * w, -r - 20], [w + r + 20, k * h], [k * w, h + r + 20], [-r - 20, k * h]][side];
    const base = state === 'play' ? 60 + elapsed * 2.5 : 70;
    ghosts.push({x, y, r, type, hp: 1, speed: base * type.speed * rand(.85, 1.15), phase: rand(0, TAU), face: 1});
  }
  function kill(g) {
    g.dead = true;
    combo = t - lastKill < 1.5 ? combo + 1 : 1; lastKill = t;
    maxCombo = Math.max(maxCombo, combo); kills++;
    const points = 10 * g.type.points * combo;
    score += points;
    popups.add(g.x, g.y - g.r, combo > 1 ? `+${points}  ×${combo}` : `+${points}`, {color: combo > 1 ? '#fde68a' : '#e0f2fe', size: 26 + Math.min(combo, 6) * 2});
    parts.emit(g.x, g.y, {count: 34, glow: true, color: g.type.halo, speed: [40, 220], life: [.5, 1.1], size: [2, 5], vy: -50, drag: 2});
    parts.emit(g.x, g.y, {count: 14, glow: true, color: [255, 200, 120], speed: [20, 140], life: [.3, .6], size: [2, 4]});
    Sound.play('vanish'); shake.add(2);
  }
  function fade(g) { // 시작·끝 화면의 유령은 울타리에서 조용히 흩어진다
    g.dead = true;
    parts.emit(g.x, g.y, {count: 16, glow: true, color: g.type.halo, speed: [20, 90], life: [.5, 1], size: [2, 4], vy: -30});
  }
  function hurt(g) {
    g.dead = true; lives--; hurtFlash = .7; shake.add(14); Sound.play('hurt');
    parts.emit(g.x, g.y, {count: 36, color: [14, 8, 24], speed: [40, 240], life: [.6, 1.1], size: [4, 8], grow: .6, alpha: .85});
    const {w, h} = view;
    parts.emit(w / 2, h / 2, {count: 22, glow: true, color: [255, 120, 60], speed: [60, 220], life: [.3, .7], size: [2, 4]});
    combo = 0;
    if (lives <= 0) { state = 'dying'; endAt = t + 2.2; banner('등불이 꺼졌습니다', '', 2000); }
  }
  function showOver() {
    state = 'over'; hideBanner();
    const rec = best('ghost', score);
    $('#final').textContent = score.toLocaleString();
    $('#newbest').hidden = !rec.isNew;
    $('#stats').innerHTML = `<span>버틴 시간<b>${Math.round(elapsed)}초</b></span><span>없앤 유령<b>${kills}</b></span><span>최고 콤보<b>×${maxCombo}</b></span>`;
    $('#overBest').textContent = `최고 기록 ${rec.best.toLocaleString()}`;
    $('#over').hidden = false;
    Sound.play('over');
  }

  function update(dt) {
    const {w, h} = view, cx = w / 2, cy = h / 2;
    if (state === 'ready' && t > readyUntil) { state = 'play'; banner('시작!', '', 700); Sound.play('go'); }
    if (state === 'play') elapsed += dt;
    spawnIn -= dt;
    if (spawnIn <= 0 && state !== 'ready' && state !== 'dying') {
      spawn();
      spawnIn = state === 'play' ? Math.max(.35, 2.2 - elapsed * .035) : rand(1.2, 2.2);
    }
    let burning = false;
    for (const g of ghosts) {
      const dx = cx - g.x, dy = cy - g.y, d = Math.hypot(dx, dy) || 1;
      const sway = Math.sin(t * 1.6 + g.phase) * 26, rush = state === 'dying' ? 3 : 1;
      g.x += (dx / d * g.speed * rush - dy / d * sway) * dt;
      g.y += (dy / d * g.speed * rush + dx / d * sway) * dt;
      g.face = dx >= 0 ? 1 : -1;
      g.looked = state === 'play' && Math.hypot(gaze.x - g.x, gaze.y - g.y) < g.r + LOOK_MARGIN;
      if (g.looked && dt) {
        burning = true;
        g.hp -= dt / (MELT_S * g.type.hp);
        if (Math.random() < .6) parts.emit(g.x + rand(-g.r, g.r) * .6, g.y + rand(-g.r, g.r) * .4, {count: 1, glow: true, color: [255, 170, 80], speed: [10, 50], vy: -70, life: [.3, .7], size: [2, 3.5]});
      }
      if (g.hp <= 0) kill(g);
      else if (d < FENCE) state === 'play' ? hurt(g) : fade(g);
    }
    ghosts = ghosts.filter(g => !g.dead);
    if (burning && (sizzleIn -= dt) <= 0) { Sound.play('sizzle'); sizzleIn = .12; }
    for (const f of fogs) { f.x += f.speed * dt; const half = scene.fog.w * f.scale / 2; if (f.x - half > w) f.x = -half; if (f.x + half < 0) f.x = w + half; }
    power = lerp(power, state === 'dying' || state === 'over' ? 0 : lives / 3, Math.min(1, dt * 3));
    hurtFlash = Math.max(0, hurtFlash - dt * 1.5);
    parts.update(dt); popups.update(dt);
    if (state === 'dying' && t > endAt) showOver();
  }

  function drawLantern(x, y) {
    const f = Math.max(0, power) * (.88 + .12 * Math.sin(t * 13) * Math.sin(t * 7.3));
    light(ctx, [255, 160, 70], x, y, FENCE * 1.9, .45 * f + .03);
    light(ctx, [255, 205, 130], x, y, 70, .9 * f);
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = `rgba(255,190,120,${.06 + .1 * power})`; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.arc(0, 0, FENCE, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,210,150,${.2 + .3 * power})`; ctx.lineWidth = 2; ctx.setLineDash([3, 13]); ctx.lineDashOffset = -t * 18;
    ctx.beginPath(); ctx.arc(0, 0, FENCE, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.translate(0, Math.sin(t * 1.6) * 4);
    ctx.strokeStyle = '#3b2a1c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -32, 10, Math.PI, 0); ctx.stroke();
    const metal = ctx.createLinearGradient(-18, 0, 18, 0);
    metal.addColorStop(0, '#1c130c'); metal.addColorStop(.5, '#6b4a2e'); metal.addColorStop(1, '#1c130c');
    ctx.fillStyle = metal;
    ctx.beginPath(); ctx.moveTo(-12, -32); ctx.lineTo(12, -32); ctx.lineTo(19, -22); ctx.lineTo(-19, -22); ctx.closePath(); ctx.fill();
    ctx.fillRect(-17, 22, 34, 7);
    const glass = ctx.createRadialGradient(0, 2, 2, 0, 0, 26);
    glass.addColorStop(0, `rgba(255,236,190,${.35 + .6 * f})`); glass.addColorStop(1, `rgba(255,150,60,${.12 + .25 * f})`);
    ctx.fillStyle = glass; ctx.beginPath(); ctx.roundRect(-15, -22, 30, 44, 5); ctx.fill();
    ctx.save(); ctx.translate(0, 8); ctx.scale(f, f);
    const flame = ctx.createLinearGradient(0, -20, 0, 6);
    flame.addColorStop(0, '#fff8dc'); flame.addColorStop(1, '#ff9f43');
    ctx.fillStyle = flame; ctx.beginPath(); ctx.moveTo(0, -20); ctx.quadraticCurveTo(9, -4, 0, 6); ctx.quadraticCurveTo(-9, -4, 0, -20); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2a1d12';
    for (const bx of [-15, -1.5, 12]) ctx.fillRect(bx, -22, 3, 44);
    ctx.restore();
  }
  function drawGhost(g) {
    const {r} = g, bob = Math.sin(t * 3 + g.phase) * 5, burn = g.looked, a = .3 + .7 * Math.max(0, g.hp);
    const x = g.x + (burn ? rand(-2, 2) : 0), y = g.y + bob, shrink = .75 + .25 * Math.max(0, g.hp);
    light(ctx, burn ? [255, 170, 90] : g.type.halo, x, y, r * 2.7, .32 * a + (burn ? .25 : 0));
    ctx.save();
    ctx.translate(x, y); ctx.scale(g.face * shrink, shrink); ctx.globalAlpha = a;
    const body = ctx.createLinearGradient(0, -r, 0, r * 1.2);
    const color = burn ? [255, 225, 200] : g.type.body;
    body.addColorStop(0, rgba(color, .96)); body.addColorStop(.55, rgba(color, .72)); body.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 0);
    ctx.lineTo(r * 1.02, r * .7);
    for (let i = 0; i <= 6; i++) ctx.lineTo(r - 2 * r * i / 6, r * .95 + Math.sin(t * 7 + i * 1.7 + g.phase) * r * .14 + (i % 2 ? -r * .12 : r * .1));
    ctx.closePath(); ctx.fill();
    const sheen = ctx.createRadialGradient(-r * .35, -r * .45, 0, -r * .35, -r * .45, r * .8);
    sheen.addColorStop(0, 'rgba(255,255,255,.45)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen; ctx.fill();
    ctx.fillStyle = 'rgba(8,12,28,.9)';
    const eye = burn ? r * .1 : r * .23;
    for (const ex of [-.34, .3]) { ctx.beginPath(); ctx.ellipse(r * ex, -r * .18, r * .15, eye, 0, 0, TAU); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(r * .02, r * .24, r * (burn ? .17 : .1), r * (burn ? .23 : .13), 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function draw(dt) {
    const {w, h} = view, cx = w / 2, cy = h / 2;
    ctx.save();
    shake.apply(ctx, dt);
    ctx.drawImage(scene.sky, -20, -20, w + 40, h + 40);
    for (const f of fogs) if (!f.front) { ctx.globalAlpha = f.a; drawSprite(ctx, scene.fog, f.x, f.y, f.scale); }
    ctx.globalAlpha = 1;
    for (const fly of flies) {
      const x = fly.x + Math.sin(t * fly.speed + fly.phase) * 40, y = fly.y + Math.cos(t * fly.speed * 1.3 + fly.phase) * 20;
      light(ctx, [200, 255, 120], x, y, 10, .5 + .5 * Math.sin(t * 3 + fly.phase));
    }
    drawLantern(cx, cy);
    for (const g of ghosts) drawGhost(g);
    if (state === 'play' || state === 'ready') { // 시선의 빛
      const hot = ghosts.some(g => g.looked);
      light(ctx, hot ? [255, 200, 140] : [150, 200, 255], gaze.x, gaze.y, 170, hot ? .42 : .28);
      light(ctx, [220, 235, 255], gaze.x, gaze.y, 36, .3);
    }
    parts.draw(ctx);
    for (const f of fogs) if (f.front) { ctx.globalAlpha = f.a * .7; drawSprite(ctx, scene.fog, f.x, f.y, f.scale); }
    ctx.globalAlpha = 1;
    popups.draw(ctx);
    ctx.restore();
    ctx.fillStyle = `rgba(0,0,6,${(1 - power) * .55})`; ctx.fillRect(0, 0, w, h); // 등불이 약해질수록 어두워진다
    ctx.drawImage(scene.vignette, 0, 0, w, h);
    if (hurtFlash > 0) { ctx.globalAlpha = hurtFlash; ctx.drawImage(scene.blood, 0, 0, w, h); ctx.globalAlpha = 1; }
  }

  let shown = {};
  function hud() {
    const values = {score: score.toLocaleString(), time: Math.floor(elapsed), lives};
    if (values.score !== shown.score) $('#score').textContent = values.score;
    if (values.time !== shown.time) $('#time').textContent = `${values.time}s`;
    if (values.lives !== shown.lives) $('#flames').innerHTML = [0, 1, 2].map(i => FLAME.replace('<svg', `<svg class="${i < lives ? '' : 'out'}"`)).join('');
    shown = values;
  }
  const tick = clock();
  let paused = false;
  function frame(now) {
    const dt = tick(now);
    const lost = state === 'play' && gazeLost();
    if (lost !== paused) { paused = lost; $('#notice').hidden = !lost; }
    t += dt;
    update(lost ? 0 : dt);
    draw(dt);
    hud();
    requestAnimationFrame(frame);
  }
  $('#startBest').textContent = `최고 기록 ${best('ghost', 0).best.toLocaleString()}`;
  $('#play').onclick = $('#again').onclick = start;
  requestAnimationFrame(frame);
</script>
</html>
